<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Service Catalog Portal</title>
    
    <!-- Tailwind & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background-color: #ede6fa;
            color: #1e1b4b;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            transition: background-color 0.3s ease;
        }

        body[data-theme="dark"] {
            background-color: #0c0d14;
            color: #f8fafc;
        }

        /* Seamless Hero Presentation Container */
        .hero-viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1920px;
            max-height: 1080px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .grok-hero-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            user-select: none;
            pointer-events: none;
        }

        /* Pure Flat Toggle in Top Right (No 3D) */
        .top-toolbar {
            position: absolute;
            top: 28px;
            right: 36px;
            z-index: 100;
        }

        .btn-flat-mode {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(216, 205, 240, 0.8);
            color: #4c1d95;
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(109, 40, 217, 0.08);
            transition: all 0.2s ease;
        }

        body[data-theme="dark"] .btn-flat-mode {
            background: rgba(20, 21, 31, 0.85);
            border-color: rgba(60, 50, 90, 0.8);
            color: #c4b5fd;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .btn-flat-mode:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(109, 40, 217, 0.15);
        }

        /* ══════════════════════════════════════════════════════════
           PRECISELY ANCHORED REAL INTERACTIVE FORM CARD
           Matches exact proportions and position of the card in Grok image
           ══════════════════════════════════════════════════════════ */
        .login-anchor-box {
            position: absolute;
            /* Precise coordinates mapping onto the lower-left card */
            left: clamp(20px, 6.5vw, 120px);
            bottom: clamp(20px, 8.5vh, 90px);
            width: clamp(290px, 26vw, 420px);
            z-index: 50;
            
            /* Clean elevated glass card that covers the drawn card seamlessly */
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            border: 1.5px solid rgba(220, 210, 245, 0.9);
            border-radius: 28px;
            padding: 28px 24px;
            box-shadow: 0 20px 50px -10px rgba(91, 33, 182, 0.18), 0 0 1px 1px rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }

        body[data-theme="dark"] .login-anchor-box {
            background: rgba(18, 19, 29, 0.92);
            border-color: rgba(91, 33, 182, 0.35);
            box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.7), 0 0 1px 1px rgba(124, 58, 237, 0.2);
            color: #ffffff;
        }

        /* Form Inputs */
        .form-input-field {
            width: 100%;
            background: #ffffff;
            border: 1px solid #d8d0ee;
            border-radius: 14px;
            padding: 10px 14px 10px 40px;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            color: #1e1b4b;
            outline: none;
            transition: all 0.2s ease;
        }

        body[data-theme="dark"] .form-input-field {
            background: #11121c;
            border-color: #2b2c40;
            color: #f8fafc;
        }

        .form-input-field:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
        }

        /* Submit Button matching royal violet in Grok image */
        .btn-submit-grok {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #6d28d9 0%, #7c3aed 100%);
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 8px 24px -4px rgba(109, 40, 217, 0.45);
            transition: all 0.2s ease;
        }

        .btn-submit-grok:hover {
            background: linear-gradient(135deg, #5b21b6 0%, #6d28d9 100%);
            transform: translateY(-1px);
            box-shadow: 0 12px 28px -4px rgba(109, 40, 217, 0.55);
        }

        .btn-submit-grok:active {
            transform: translateY(0);
        }
    </style>
</head>
<body data-theme="light">

    <!-- Top Toolbar: Pure Flat Icon Toggle -->
    <div class="top-toolbar">
        <button class="btn-flat-mode" onclick="toggleTheme()">
            <i id="themeIcon" data-lucide="moon" class="w-4 h-4 text-purple-600"></i>
            <span id="themeLabel">Dark</span>
        </button>
    </div>

    <!-- Main Panoramic Viewport (Full Original Grok Artwork) -->
    <div class="hero-viewport">
        <!-- Original 1792 x 1008 Grok Artwork in Full Glory -->
        <img src="./static/img/grok_login_hero.jpg" alt="Service Catalog Platform Authentication" class="grok-hero-image" />

        <!-- Real Interactive Form Card Anchored Exactly over the Lower-Left Area -->
        <div class="login-anchor-box">
            <!-- Brand Title Bar -->
            <div class="flex items-center justify-between border-b border-purple-100 dark:border-purple-900/40 pb-3 mb-4">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-xl bg-purple-500/15 border border-purple-500/30 flex items-center justify-center text-purple-700 dark:text-purple-300">
                        <i data-lucide="folder-code" class="w-4 h-4"></i>
                    </div>
                    <div>
                        <h2 class="text-sm font-bold text-slate-900 dark:text-white leading-none">Service Catalog</h2>
                        <span class="text-[10px] text-[#3ecf8e] font-semibold font-mono uppercase tracking-wider mt-0.5 block">Portal Platform</span>
                    </div>
                </div>
            </div>

            <!-- Live Form -->
            <form action="/dashboard" method="GET" class="space-y-3.5">
                <!-- Username / Email Field -->
                <div class="space-y-1">
                    <div class="relative flex items-center">
                        <i data-lucide="user" class="w-4 h-4 text-purple-500/70 absolute left-3.5 pointer-events-none"></i>
                        <input type="email" id="email" name="email" value="admin@oona-insurance.com" placeholder="Work Email" class="form-input-field" required />
                    </div>
                </div>

                <!-- Password Field with Visibility Toggle -->
                <div class="space-y-1">
                    <div class="relative flex items-center">
                        <i data-lucide="lock" class="w-4 h-4 text-purple-500/70 absolute left-3.5 pointer-events-none"></i>
                        <input type="password" id="password" name="password" value="admin123" placeholder="Password" class="form-input-field pr-10" required />
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 text-slate-400 hover:text-purple-600 focus:outline-none">
                            <i id="eyeIcon" data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember & Help -->
                <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 pt-0.5 font-sans">
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" checked class="rounded border-purple-300 text-purple-600 focus:ring-purple-500" style="accent-color:#7c3aed;" />
                        <span>Remember session</span>
                    </label>
                    <a href="#" onclick="alert('Default credentials: admin@oona-insurance.com / admin123')" class="text-purple-600 dark:text-purple-400 font-medium hover:underline font-mono text-[11px]">Help?</a>
                </div>

                <!-- Single Purple Arrow CTA Button (NO SSO INFO UNDERNEATH) -->
                <button type="submit" class="btn-submit-grok mt-2">
                    <span>Sign In to Catalog</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Password visibility toggle
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                pwdInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        // Dark / Light Theme Toggle (Flat Icon, No 3D)
        let isDark = false;
        function toggleTheme() {
            isDark = !isDark;
            document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
            
            const themeLabel = document.getElementById('themeLabel');
            const themeIcon = document.getElementById('themeIcon');
            
            if (isDark) {
                themeLabel.innerText = 'Light';
                themeIcon.setAttribute('data-lucide', 'sun');
                themeIcon.className = 'w-4 h-4 text-amber-400';
            } else {
                themeLabel.innerText = 'Dark';
                themeIcon.setAttribute('data-lucide', 'moon');
                themeIcon.className = 'w-4 h-4 text-purple-600';
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>
