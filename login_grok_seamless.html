<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Service Catalog Portal</title>
    
    <!-- HTMX & Lucide -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/js/htmx.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background-color: #ede7fa;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Responsive 16:9 Aspect Ratio Container */
        .stage-viewport {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* 16:9 */
            max-height: 100vh;
            max-width: 177.78vh; /* 16:9 */
            background-color: #ede7fa;
            box-shadow: 0 30px 80px -20px rgba(91, 33, 182, 0.25);
            overflow: hidden;
        }

        /* 100% Uncompromised High-Res Grok Artwork */
        .grok-hero-art {
            width: 100%;
            height: 100%;
            display: block;
            user-select: none;
            pointer-events: none;
        }

        /* ══════════════════════════════════════════════════════════
           SEAMLESS INTERACTIVE FORM OVERLAY (DIRECT PIXEL ALIGNMENT)
           ZERO DOUBLE-BORDER GHOSTING — FITS THE DRAWN CARD 1:1
           ══════════════════════════════════════════════════════════ */
        /* Exact Bounding Box of the drawn card */
        .direct-form-zone {
            position: absolute;
            left: 14.2%;
            top: 61.2%;
            width: 22.8%;
            height: 23.5%;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Clean Translucent Input Fields that fill the illustrated slots */
        .seamless-input-slot {
            width: 100%;
            height: 25.5%;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.94);
            border: 1.5px solid rgba(210, 195, 240, 0.9);
            box-shadow: 0 4px 12px rgba(109, 40, 217, 0.08), inset 0 1px 2px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            padding: 0 14px 0 38px;
            position: relative;
            transition: all 0.2s ease;
        }
        .seamless-input-slot:focus-within {
            background: #ffffff;
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.25), 0 6px 16px rgba(109, 40, 217, 0.15);
        }

        .seamless-input-slot input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-size: clamp(10px, 0.85vw, 13.5px);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            color: #1e1b4b;
        }

        .input-icon-lead {
            position: absolute;
            left: 12px;
            width: clamp(13px, 1vw, 16px);
            height: clamp(13px, 1vw, 16px);
            color: #7c3aed;
            pointer-events: none;
        }

        .eye-toggle-btn {
            position: absolute;
            right: 12px;
            width: clamp(14px, 1.1vw, 18px);
            height: clamp(14px, 1.1vw, 18px);
            color: #94a3b8;
            cursor: pointer;
            transition: color 0.15s ease;
            background: none;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .eye-toggle-btn:hover {
            color: #7c3aed;
        }

        /* Seamless Submit Button matching the royal purple button 1:1 */
        .seamless-submit-btn {
            width: 100%;
            height: 26.5%;
            border-radius: 9999px;
            background: linear-gradient(135deg, #6d28d9 0%, #7c3aed 100%);
            border: none;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(10px, 0.85vw, 13px);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(109, 40, 217, 0.45);
            transition: all 0.2s ease;
        }
        .seamless-submit-btn:hover {
            background: linear-gradient(135deg, #5b21b6 0%, #6d28d9 100%);
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(109, 40, 217, 0.6);
        }
        .seamless-submit-btn:active {
            transform: translateY(0);
        }

        /* Flat Mode Toggle in Top-Right (Flat icon, no 3D) */
        .top-toolbar {
            position: absolute;
            top: 24px;
            right: 28px;
            z-index: 100;
        }
        .btn-flat-mode {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(216, 205, 240, 0.8);
            color: #4c1d95;
            padding: 7px 15px;
            border-radius: 9999px;
            font-size: 11.5px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
            box-shadow: 0 4px 12px rgba(109, 40, 217, 0.08);
            transition: all 0.2s ease;
        }
        .btn-flat-mode:hover {
            background: #ffffff;
            transform: translateY(-1px);
        }

        /* Error Banner if any */
        #login-error {
            position: absolute;
            top: -38px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: #dc2626;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- Main Panoramic 16:9 Viewport -->
    <div class="stage-viewport">
        <!-- Original 1792 x 1008 Grok Artwork in Full Uncropped Splendor -->
        <img src="./static/img/grok_login_hero.jpg" alt="Service Catalog Platform Authentication" class="grok-hero-art" />

        <!-- Flat Mode Toggle in Top-Right -->
        <div class="top-toolbar">
            <button class="btn-flat-mode" onclick="toggleThemeNotice()">
                <i data-lucide="moon" class="w-3.5 h-3.5 text-purple-600"></i>
                <span>Dark</span>
            </button>
        </div>

        <!-- ══════════════════════════════════════════════════════════
             LIVE INTERACTIVE FORM DIRECTLY ALIGNED INTO THE ARTWORK
             ══════════════════════════════════════════════════════════ -->
        <div class="direct-form-zone">
            <!-- HTMX Error Container -->
            <div id="login-error"></div>

            <form hx-post="/api/login" hx-target="#login-error" class="h-full flex flex-col justify-between">
                <!-- 1. Work Email Slot -->
                <div class="seamless-input-slot">
                    <i data-lucide="user" class="input-icon-lead"></i>
                    <input type="email" id="email" name="email" value="admin@oona-insurance.com" placeholder="admin@oona-insurance.com" required />
                </div>

                <!-- 2. Password Slot -->
                <div class="seamless-input-slot">
                    <i data-lucide="lock" class="input-icon-lead"></i>
                    <input type="password" id="password" name="password" value="admin123" placeholder="••••••••••••" required />
                    <button type="button" class="eye-toggle-btn" onclick="togglePasswordVisibility()">
                        <i id="eyeIcon" data-lucide="eye" class="w-full h-full"></i>
                    </button>
                </div>

                <!-- 3. Submit Action Button (NO SSO INFO UNDERNEATH) -->
                <button type="submit" class="seamless-submit-btn">
                    <span>Sign In to Catalog</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                pwdInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        function toggleThemeNotice() {
            alert("Mode visual baru Oona Service Catalog menggunakan canvas lilac-violet signature Grok. Toggle dark palette dapat diaktifkan di dashboard.");
        }
    </script>
</body>
</html>
