<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Castan Service Catalog</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/lucide.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /* LIGHT MODE — Option A artwork + original light chrome (do not restyle) */
        html:not(.dark), html.light-mode, body:not(.dark) {
            --bg-page: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --input-focus-border: #7c3aed;
            --text-heading: #0f172a;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --text-dim: #94a3b8;
            --hero-bg: #f8fafc;
            --panel-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
            --toggle-btn-hover: #f1f5f9;
            --cta-bg: #0f172a;
            --cta-text: #ffffff;
            --cta-border: #1e293b;
        }

        /* DARK MODE: Castan / Supabase (#121212 canvas, #171717 card, #282828 border) */
        html.dark, body.dark {
            --bg-page: #121212;
            --card-bg: #171717;
            --card-border: #282828;
            --input-bg: #121212;
            --input-border: #282828;
            --input-focus-border: #a78bfa;
            --text-heading: #ffffff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --hero-bg: #121212;
            --panel-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85);
            --toggle-btn-hover: #242424;
            --cta-bg: #f8fafc;
            --cta-text: #09090b;
            --cta-border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            -webkit-font-smoothing: antialiased;
        }

        .login-master-stage {
            width: 100%;
            max-width: 1080px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: var(--panel-shadow);
            display: grid;
            grid-template-columns: 1fr;
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        @media (min-width: 1024px) {
            .login-master-stage {
                grid-template-columns: 460px 1fr;
                min-height: 620px;
            }
        }

        .form-pane {
            display: flex;
            flex-direction: column;
            padding: 28px 36px 36px;
            position: relative;
        }

        .theme-toggle-icon-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            z-index: 20;
        }

        .theme-toggle-icon-btn:hover {
            background: var(--toggle-btn-hover);
            color: var(--text-heading);
        }

        .form-body {
            max-width: 360px;
            width: 100%;
            margin: auto 0;
            padding-top: 28px;
        }

        .brand-lockup {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .brand-lockup img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            display: block;
        }

        .brand-wordmark {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text-heading);
            line-height: 1;
        }

        .welcome-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-heading);
            margin-bottom: 6px;
        }

        .welcome-sub {
            font-size: 13px;
            line-height: 1.5;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .form-item { margin-bottom: 16px; }

        .form-label-title {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 6px;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
        }

        .input-box-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .field-icon {
            position: absolute;
            left: 14px;
            color: var(--text-dim);
            pointer-events: none;
        }

        .input-control {
            width: 100%;
            height: 44px;
            padding: 0 14px 0 42px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            font-size: 13.5px;
            color: var(--text-main);
            outline: none;
            font-family: inherit;
        }

        .input-control:focus {
            border-color: var(--input-focus-border);
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
            margin: 4px 0 18px;
            cursor: pointer;
            user-select: none;
        }

        .btn-submit-action {
            width: 100%;
            height: 46px;
            background: var(--cta-bg);
            color: var(--cta-text);
            border: 1px solid var(--cta-border);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: none;
        }

        .btn-submit-action:hover {
            transform: translateY(-1px);
        }

        .hero-pane {
            display: none;
            background-color: var(--hero-bg);
            border-left: 1px solid var(--card-border);
            overflow: hidden;
            position: relative;
        }

        @media (min-width: 1024px) {
            .hero-pane { display: flex; align-items: center; justify-content: center; }
        }

        .hero-pane img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            user-select: none;
            pointer-events: none;
        }
    </style>
</head>
<body class="dark" data-theme="dark">

    <div class="login-master-stage">
        <div class="form-pane">
            <button type="button" class="theme-toggle-icon-btn" id="theme-toggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
                <i id="themeIcon" data-lucide="sun" class="w-4 h-4"></i>
            </button>

            <div class="form-body">
                <div class="brand-lockup">
                    <img id="brandMark" src="/static/img/risu_user_white.png" alt="Castan" />
                    <span class="brand-wordmark">Castan</span>
                </div>

                <h1 class="welcome-title">Welcome back to Service Catalog</h1>
                <p class="welcome-sub">Sign in to access centralized microservices inventory, Terraform IaC mesh, and deployment pipelines.</p>

                <form hx-post="/api/login" hx-target="#login-error">
                    <div class="form-item">
                        <label class="form-label-title" for="email">Work Email</label>
                        <div class="input-box-wrapper">
                            <i data-lucide="user" class="field-icon" style="width:16px; height:16px;"></i>
                            <input type="email" id="email" name="email" class="input-control" placeholder="admin@oona-insurance.com" value="admin@oona-insurance.com" required autocomplete="username" />
                        </div>
                    </div>

                    <div class="form-item">
                        <label class="form-label-title" for="password">Password</label>
                        <div class="input-box-wrapper">
                            <i data-lucide="lock" class="field-icon" style="width:16px; height:16px;"></i>
                            <input type="password" id="password" name="password" class="input-control" style="padding-right:42px;" placeholder="••••••••••••" value="admin123" required autocomplete="current-password" />
                            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3" style="color: var(--text-dim); background:none; border:none; cursor:pointer;" aria-label="Show password">
                                <i id="eyeIcon" data-lucide="eye" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <label class="remember-row">
                        <input type="checkbox" checked style="accent-color:#7c3aed;" />
                        <span>Remember session</span>
                    </label>

                    <div id="login-error"></div>

                    <button type="submit" class="btn-submit-action">
                        <span>Sign In to Castan</span>
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </form>
            </div>
        </div>

        <div class="hero-pane">
            <img id="heroImageLight" src="/static/img/grok_option_1.jpg" alt="Service Catalog pair programming" class="hidden" />
            <img id="heroImageDark" src="/static/img/grok_option_1_dark.jpg" alt="Service Catalog pair programming" />
        </div>
    </div>

    <script>
        lucide.createIcons();

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                pwdInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        function setTheme(theme) {
            const isDark = theme === 'dark';
            document.documentElement.classList.toggle('dark', isDark);
            document.documentElement.classList.toggle('light-mode', !isDark);
            document.documentElement.setAttribute('data-theme', theme);
            document.body.classList.toggle('dark', isDark);
            document.body.classList.toggle('light-mode', !isDark);
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);

            const themeIcon = document.getElementById('themeIcon');
            const brandMark = document.getElementById('brandMark');
            const heroLight = document.getElementById('heroImageLight');
            const heroDark = document.getElementById('heroImageDark');

            if (isDark) {
                if (themeIcon) { themeIcon.setAttribute('data-lucide', 'sun'); }
                if (brandMark) brandMark.src = '/static/img/risu_user_white.png';
                if (heroLight) heroLight.classList.add('hidden');
                if (heroDark) heroDark.classList.remove('hidden');
            } else {
                if (themeIcon) { themeIcon.setAttribute('data-lucide', 'moon'); }
                if (brandMark) brandMark.src = '/static/img/risu_user_black.png';
                if (heroLight) heroLight.classList.remove('hidden');
                if (heroDark) heroDark.classList.add('hidden');
            }
            lucide.createIcons();
        }

        function toggleTheme() {
            const current = localStorage.getItem('theme') || 'dark';
            setTheme(current === 'dark' ? 'light' : 'dark');
        }

        setTheme(localStorage.getItem('theme') || 'dark');
    </script>
</body>
</html>
