{{ define "content" }}
<div class="max-w-4xl mx-auto">
    <div class="mb-8 border-b pb-5">
        <h2 class="text-2xl font-bold text-gray-900">User Profile</h2>
        <p class="text-sm text-gray-500 mt-1">Manage your account information and preferences.</p>
    </div>

    <div class="bg-white shadow-sm ring-1 ring-gray-900/5 rounded-xl p-6">
        <dl class="divide-y divide-gray-100">
            <div class="px-4 py-4 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-0">
                <dt class="text-sm font-medium text-gray-900">Email address</dt>
                <dd class="mt-1 text-sm text-gray-700 sm:col-span-2 sm:mt-0">{{ if .User }}{{ .User.Email }}{{ else }}N/A{{ end }}</dd>
            </div>
            <div class="px-4 py-4 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-0">
                <dt class="text-sm font-medium text-gray-900">Role</dt>
                <dd class="mt-1 text-sm text-gray-700 sm:col-span-2 sm:mt-0 capitalize">{{ if .User }}{{ .User.Role }}{{ else }}N/A{{ end }}</dd>
            </div>
            <div class="px-4 py-4 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-0">
                <dt class="text-sm font-medium text-gray-900">User ID</dt>
                <dd class="mt-1 text-sm font-mono text-gray-500 sm:col-span-2 sm:mt-0">{{ if .User }}{{ .User.UserID }}{{ else }}N/A{{ end }}</dd>
            </div>
        </dl>
    </div>
</div>
{{ end }}
