<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Service Catalog Portal (Flat 2D Vector Clean Edition)</title>
    
    <!-- Tailwind & Lucide -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        :root, body[data-theme="light"] {
            --bg-page: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-dim: #94a3b8;
            
            --brand-purple: #7c3aed;
            --brand-purple-hover: #6d28d9;
            --brand-pill-bg: #f5f3ff;
            --brand-pill-border: #ddd6fe;
            --brand-pill-text: #7c3aed;
            
            --card-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(15, 23, 42, 0.05);
            --bg-glow-1: rgba(124, 58, 237, 0.06);
            --bg-glow-2: rgba(56, 189, 248, 0.06);
        }

        body[data-theme="dark"] {
            --bg-page: #0f0f11;
            --card-bg: #171719;
            --card-border: #28282b;
            --input-bg: #121214;
            --input-border: #28282b;
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            
            --brand-purple: #7c3aed;
            --brand-purple-hover: #6d28d9;
            --brand-pill-bg: rgba(124, 58, 237, 0.15);
            --brand-pill-border: rgba(167, 139, 250, 0.3);
            --brand-pill-text: #a78bfa;
            
            --card-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8), 0 0 1px 1px rgba(255, 255, 255, 0.08);
            --bg-glow-1: rgba(124, 58, 237, 0.12);
            --bg-glow-2: rgba(56, 189, 248, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient Glows */
        .ambient-glow-left {
            position: absolute;
            left: 5%;
            top: 20%;
            width: 450px;
            height: 450px;
            background: var(--bg-glow-1);
            filter: blur(120px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        .ambient-glow-right {
            position: absolute;
            right: 5%;
            top: 20%;
            width: 450px;
            height: 450px;
            background: var(--bg-glow-2);
            filter: blur(120px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        /* Top Toolbar with Flat Icon Toggle */
        .top-toolbar {
            position: absolute;
            top: 24px;
            right: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
        }

        .btn-flat-toggle {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease;
        }
        .btn-flat-toggle:hover {
            border-color: #a78bfa;
            transform: translateY(-1px);
        }

        /* Continuous Stage Layout */
        .stage-container {
            width: 100%;
            max-width: 1560px;
            min-height: 640px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 40px;
            position: relative;
            z-index: 10;
        }

        /* Pure 2D Flat Vector Flanking Illustrations */
        .flank-illustration {
            flex: 1;
            max-width: 500px;
            height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            pointer-events: none;
            user-select: none;
        }

        .clean-vector-svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Center Elevated Card */
        .login-card-clean {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            box-shadow: var(--card-shadow);
            padding: 42px 36px;
            position: relative;
            z-index: 30;
            flex-shrink: 0;
            margin: 0 24px;
        }

        .brand-icon-box {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: var(--brand-pill-bg);
            border: 1px solid var(--brand-pill-border);
            display: grid;
            place-items: center;
            color: var(--brand-pill-text);
            margin: 0 auto 16px;
            transition: transform 0.25s ease;
        }
        .login-card-clean:hover .brand-icon-box {
            transform: scale(1.06);
        }

        .login-heading {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-align: center;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .login-subheading {
            font-size: 12.5px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 28px;
            font-family: 'JetBrains Mono', monospace;
        }

        .form-item {
            margin-bottom: 16px;
        }

        .form-label-title {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-dim);
            margin-bottom: 6px;
            font-family: 'JetBrains Mono', monospace;
        }

        .input-box-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .field-icon {
            position: absolute;
            left: 14px;
            color: var(--text-dim);
            pointer-events: none;
        }

        .input-control {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 11px 14px 11px 40px;
            border-radius: 12px;
            font-size: 13px;
            outline: none;
            font-family: 'JetBrains Mono', monospace;
        }

        .input-control:focus {
            border-color: var(--brand-purple);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-bottom: 24px;
            font-family: inherit;
        }

        .remember-group {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .forgot-link-btn {
            color: var(--brand-pill-text);
            font-weight: 600;
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
        }
        .forgot-link-btn:hover {
            text-decoration: underline;
        }

        .btn-submit-action {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 13.5px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.3);
            transition: all 0.2s ease;
        }

        .btn-submit-action:hover {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
        }

        @media (max-width: 1180px) {
            .flank-right { display: none; }
        }
        @media (max-width: 860px) {
            .flank-left, .flank-right { display: none; }
            .stage-container { padding: 20px; }
        }
    </style>
</head>

    <script>
        lucide.createIcons();

        let isDark = true;
        function toggleTheme() {
            isDark = !isDark;
            document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
            
            const themeLabel = document.getElementById('themeLabel');
            const themeIcon = document.getElementById('themeIcon');
            
            themeLabel.innerText = isDark ? 'Dark' : 'Light';
            themeIcon.setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            themeIcon.className = isDark ? 'w-4 h-4 text-[#a78bfa]' : 'w-4 h-4 text-amber-500';
            
            lucide.createIcons();
        }
    </script>
