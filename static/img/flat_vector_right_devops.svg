<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cloudTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cloudBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="rocketFlame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Network Grid Floor / Infrastructure Mesh Topology -->
  <g opacity="0.4">
    <line x1="100" y1="460" x2="520" y2="460" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="80" y1="420" x2="540" y2="420" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="120" y1="380" x2="500" y2="380" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="150" y1="460" x2="200" y2="380" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="280" y1="460" x2="300" y2="380" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="420" y1="460" x2="400" y2="380" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- CLOUD DEVOPS ENGINEER (Center) -->
  <g transform="translate(180, 110)">
    <!-- Head -->
    <circle cx="95" cy="65" r="22" fill="#fcd34d"/>
    <!-- Hair / Casual Style -->
    <path d="M75,60 Q85,42 105,44 Q118,48 115,62 Q105,56 85,58 Z" fill="#334155"/>
    <!-- Glasses -->
    <rect x="83" y="61" width="10" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="97" y="61" width="10" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="93" y1="65" x2="97" y2="65" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Smile -->
    <path d="M92,76 Q97,80 102,76" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Body / Hoodie (Dark Slate with Cyan Drawstrings) -->
    <path d="M62,130 Q70,90 95,90 Q120,90 128,130 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="90" y1="96" x2="90" y2="114" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="100" y1="96" x2="100" y2="114" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Hands on Server Console -->
    <rect x="45" y="125" width="100" height="22" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="58" cy="136" r="3" fill="#22c55e"/>
    <circle cx="68" cy="136" r="3" fill="#38bdf8"/>
    <rect x="80" y="132" width="55" height="8" rx="3" fill="#1e293b"/>
  </g>

  <!-- SERVER RACKS (Compute Nodes) -->
  <g transform="translate(195, 260)">
    <!-- Rack Unit 1 -->
    <rect width="160" height="42" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="16" cy="21" r="3.5" fill="#34d399"/>
    <circle cx="28" cy="21" r="3.5" fill="#38bdf8"/>
    <rect x="42" y="14" width="102" height="14" rx="3" fill="#1e293b"/>
    <line x1="48" y1="21" x2="138" y2="21" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Rack Unit 2 -->
    <g transform="translate(0, 48)">
      <rect width="160" height="42" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
      <circle cx="16" cy="21" r="3.5" fill="#a78bfa"/>
      <circle cx="28" cy="21" r="3.5" fill="#34d399"/>
      <rect x="42" y="14" width="102" height="14" rx="3" fill="#1e293b"/>
      <line x1="48" y1="21" x2="138" y2="21" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,4"/>
    </g>

    <!-- Rack Unit 3 -->
    <g transform="translate(0, 96)">
      <rect width="160" height="42" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="16" cy="21" r="3.5" fill="#38bdf8"/>
      <circle cx="28" cy="21" r="3.5" fill="#eab308"/>
      <rect x="42" y="14" width="102" height="14" rx="3" fill="#1e293b"/>
      <line x1="48" y1="21" x2="138" y2="21" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
    </g>
  </g>

  <!-- DATABASE CYLINDERS (RDS Database Cluster) -->
  <g transform="translate(50, 310)">
    <!-- Base Cluster Shadow -->
    <ellipse cx="60" cy="95" rx="55" ry="14" fill="#0284c7" fill-opacity="0.15"/>
    
    <!-- Cylinder 1 -->
    <path d="M20,30 L20,70 Q60,95 100,70 L100,30" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="60" cy="30" rx="40" ry="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="60" cy="50" rx="40" ry="14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="60" y="34" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">RDS DB</text>

    <!-- Cylinder 2 (Mini Replica) -->
    <g transform="translate(65, 35)">
      <path d="M10,20 L10,50 Q40,68 70,50 L70,20" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
      <ellipse cx="40" cy="20" rx="30" ry="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
      <text x="40" y="24" font-family="monospace" font-size="9" font-weight="bold" fill="#34d399" text-anchor="middle">Replica</text>
    </g>
  </g>

  <!-- FLOATING TELEMETRY HUD TILES (Real-World & Non-Repetitive) -->
  <!-- Telemetry Tile 1: System Uptime -->
  <g transform="translate(60, 110)">
    <rect width="130" height="46" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#34d399" stroke-width="1.5"/>
    <text x="14" y="20" font-family="monospace" font-size="9" fill="#94a3b8">AVAILABILITY</text>
    <text x="14" y="36" font-family="monospace" font-size="13" font-weight="bold" fill="#34d399">Uptime: 99.98%</text>
    <circle cx="114" cy="22" r="3.5" fill="#34d399"/>
  </g>

  <!-- Telemetry Tile 2: Region Latency -->
  <g transform="translate(380, 290)">
    <rect width="135" height="46" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="14" y="20" font-family="monospace" font-size="9" fill="#94a3b8">AWS JAKARTA</text>
    <text x="14" y="36" font-family="monospace" font-size="13" font-weight="bold" fill="#38bdf8">Latency: 14ms</text>
    <circle cx="120" cy="22" r="3.5" fill="#38bdf8"/>
  </g>

  <!-- Telemetry Tile 3: CI/CD Pods -->
  <g transform="translate(410, 410)">
    <rect width="125" height="46" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="14" y="20" font-family="monospace" font-size="9" fill="#94a3b8">CONTAINERS</text>
    <text x="14" y="36" font-family="monospace" font-size="13" font-weight="bold" fill="#a78bfa">Pods: 24/24 OK</text>
    <circle cx="110" cy="22" r="3.5" fill="#a78bfa"/>
  </g>

  <!-- ROCKET (CI/CD Deployment & Pipeline Velocity) -->
  <g transform="translate(440, 60) rotate(-35)">
    <!-- Motion trajectory arc -->
    <path d="M0,120 Q-30,170 -60,220" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" opacity="0.7"/>

    <!-- Rocket Body -->
    <path d="M0,0 Q18,35 16,80 L-16,80 Q-18,35 0,0 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
    <!-- Cone Top -->
    <path d="M0,0 Q10,20 12,30 L-12,30 Q-10,20 0,0 Z" fill="#ef4444"/>
    <!-- Porthole Window -->
    <circle cx="0" cy="45" r="7" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Fins -->
    <polygon points="-16,65 -28,85 -16,80" fill="#6366f1" stroke="#0f172a" stroke-width="1.5"/>
    <polygon points="16,65 28,85 16,80" fill="#6366f1" stroke="#0f172a" stroke-width="1.5"/>
    
    <!-- Vector Clean Thrust Flame -->
    <polygon points="-8,82 0,115 8,82" fill="url(#rocketFlame)"/>
    <polygon points="-4,82 0,100 4,82" fill="#fef08a"/>
  </g>
</svg>